<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Neumo mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --night:#05080c; --night-2:#0b0f14; --white:#fff; --ash:#aaa9ad; --graphite:#5b5b5b;
  --glass:rgba(255,255,255,.03); --hair:rgba(255,255,255,.1);
  --ok:#7fd6a4; --bad:#ff8f8f;
  --sans:"Geist",system-ui,sans-serif; --script:"Great Vibes",cursive; --mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--white);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);font-size:13px;color:var(--ash);letter-spacing:0}
.script{font-family:var(--script);font-weight:400;letter-spacing:0}
[hidden]{display:none!important}

/* encabezado */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--night) 70%,transparent);padding:18px 0 22px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;letter-spacing:-.04em}
.logo .script{font-size:28px;margin-left:2px}
.stats{display:flex;gap:16px}
.stats b{color:var(--white);font-weight:500}

/* portada */
.hero{padding:26px 0 8px}
.hero .tag{font-size:13px;color:var(--ash)}
.hero h1{margin:14px 0 14px;font-weight:500;font-size:clamp(48px,11vw,104px);line-height:.95;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 30%,#aaa9ad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .script{font-size:1.3em;line-height:.7;padding-right:.12em}
.hero p{margin:0;max-width:520px;color:var(--ash);font-size:16px;line-height:1.45}
.bar{height:2px;background:var(--hair);margin-top:22px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--white);transition:width .8s var(--ease)}

/* mapa */
.map{position:relative;padding:34px 0 120px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.step{position:relative;display:flex;align-items:center;gap:18px;height:132px}
.step.r{flex-direction:row-reverse;text-align:right}
.node{position:relative;flex:none;width:92px;height:92px;border-radius:50%;background:var(--night-2);border:1px solid var(--hair);
  display:grid;place-items:center;transition:transform .5s var(--ease),background .3s}
.node:hover{transform:scale(1.05)}
.node .num{font-family:var(--script);font-size:34px;color:var(--ash);line-height:1}
.node svg{position:absolute;inset:-5px;width:102px;height:102px;transform:rotate(-90deg)}
.node circle{fill:none;stroke-width:3}
.node .trk{stroke:transparent}
.node .prg{stroke:var(--white);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.step.now .node{background:var(--white)}
.step.now .node .num{color:var(--night)}
.step.done .node .num{color:#3ddc84}
.step.done .node{border-color:#3ddc84;background:rgba(61,220,132,.10)}
.step.done .node .prg{stroke:#3ddc84}
.node .chk{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:#3ddc84;color:var(--night);display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1}
.step.done .info .mono{color:#3ddc84}
.step.lock .node{opacity:.35}
.step.lock .info{opacity:.35}
.info{min-width:0;flex:1}
.info h2{margin:0 0 6px;font-size:19px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.step.pad-l{padding-left:22%}
.finh{position:relative;text-align:center;padding:46px 0 26px}.finh .mono{color:#ff9a1f}.finh p{margin:8px 0 0;color:var(--ash);font-size:14px}
.step.pad-r{padding-right:22%}

/* botones */
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--white);color:var(--night);border-radius:999px;padding:6px 6px 6px 22px;font-size:15px}
.pill .arr{width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--white);display:grid;place-items:center;transition:transform .4s var(--ease)}
.pill:hover .arr{transform:rotate(-45deg) scale(1.08)}
.pill:disabled{opacity:.3;cursor:default}
.ghost{border:1px solid var(--hair);border-radius:999px;padding:12px 20px;font-size:15px}
.ghost:hover{background:var(--glass)}
/* brillo sutil que cruza los botones */
.lfoot .in.fin{flex-wrap:wrap;justify-content:center;gap:10px}
.cal{margin:6px 0 16px}.cal .nota{font-size:72px;font-weight:600;line-height:1;letter-spacing:-.03em}.cal .nota small{font-size:22px;opacity:.55;font-weight:400}
.cal>.mono{margin-top:8px}.cal details{margin-top:14px;text-align:left}.cal summary{cursor:pointer;text-align:center}
.cal ol{max-height:34vh;overflow:auto;margin:10px 0 0;padding-left:22px;font-size:14px;line-height:1.4}.cal li{margin-bottom:10px;opacity:.85}.cal li b{display:block;color:#fff;margin-top:2px}
@keyframes brillo{0%,55%{background-position:130% 0}100%{background-position:-60% 0}}
.ghost,.lcl,.pill{background-repeat:no-repeat;background-size:220% 100%;background-position:130% 0;animation:brillo 4.2s ease-in-out infinite}
.ghost,.lcl{background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%)}
.pill{background-image:linear-gradient(110deg,transparent 42%,rgba(5,8,12,.13) 50%,transparent 58%)}
.pill:disabled{animation:none}
/* efecto ola: las letras de los botones se alumbran una por una, sutil, para que se noten */
@keyframes ola{0%,62%,100%{opacity:.66;transform:none;text-shadow:none}74%{opacity:1;transform:translateY(-1.5px);text-shadow:0 0 12px currentColor}}
.ol{display:inline-block;white-space:pre;opacity:.66;animation:ola 3.4s ease-in-out infinite}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--night) 65%,transparent);z-index:4}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* hoja de tema */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:end center}
.sheet .card{width:min(720px,100%);background:var(--night-2);border:1px solid var(--hair);border-radius:20px 20px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:up .5s var(--ease)}
.sheet h3{margin:6px 0 10px;font-size:clamp(28px,6vw,40px);font-weight:500;letter-spacing:-.04em;line-height:1}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* clase del tema (caso, ideas y perlas en diapositivas) */
.cl{text-align:center;padding-top:clamp(8px,4vh,40px)}
.cl .esc{position:relative;width:132px;height:132px;margin:26px auto 26px}
.cl .av{width:132px;height:132px;border-radius:50%;background:var(--night-2);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1}
.cl .chip{position:absolute;left:74%;top:-20px;white-space:nowrap;background:#fff;color:#000;border-radius:16px 16px 16px 4px;padding:7px 13px;font-size:14px;font-weight:600;letter-spacing:-.01em;animation:in .6s .15s var(--ease) both}
.cl h4{margin:10px 0 14px;font-size:clamp(25px,5.4vw,36px);font-weight:500;letter-spacing:-.04em;line-height:1.05}
.cl p{margin:0 auto;max-width:560px;font-size:clamp(17px,2.5vw,20px);line-height:1.5;color:var(--ash);text-align:left}
.cl p b{color:#fff;font-weight:600}
.cl.perla .av{border-color:#ff9a1f;box-shadow:0 0 0 6px rgba(255,154,31,.08)}
.cl.perla .mono,.cl.perla p b{color:#ff9a1f}
.cl.perla .chip{background:#ff9a1f}
.cl.caso .av{border-color:#3ddc84}
.cl.caso .mono{color:#3ddc84}
@media(max-width:480px){.cl .chip{left:62%}}

.cl.clave .av{border-style:dashed;border-color:#b388ff;box-shadow:0 0 0 6px rgba(179,136,255,.08)}
.cl.clave .mono,.cl.clave h4,.cl.clave p{color:#b388ff}
.cl.clave p b{color:#c9a6ff}
.cl.clave .chip{background:#b388ff}
.cl .rul{margin-top:22px}
/* lección */
.lesson{position:fixed;inset:0;z-index:30;background:var(--night);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:16px 20px}
.ltop .bar{flex:1;margin:0;height:4px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);font-size:16px;flex:none}
.lbody{flex:1;overflow:auto;padding:10px 20px 20px}
.lbody .in{max-width:640px;margin:0 auto;animation:in .6s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.kind{font-size:13px;color:var(--ash)}
.q{font-size:clamp(21px,4.4vw,28px);letter-spacing:-.02em;line-height:1.2;margin:14px 0 22px}
.caso u{text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-decoration-thickness:1.5px;text-underline-offset:3px;color:var(--white)}
.orig{font-size:13px;color:var(--ash);line-height:1.45;margin:12px 0 0}.orig .mono{display:block;margin-bottom:4px}
.caso{font-size:15px;color:var(--ash);line-height:1.45;border-left:1px solid var(--hair);padding:2px 0 2px 16px;margin:14px 0 4px}
.caso .mono{margin-bottom:6px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin-bottom:10px;font-size:16px;line-height:1.35;transition:background .2s,border-color .2s,opacity .2s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.07)}
.opt .l{font-family:var(--mono);font-size:13px;color:var(--ash);padding-top:2px}
.opt.sel{border-color:var(--white)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.4}
.ans{background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:18px;font-size:18px;line-height:1.35;animation:in .5s var(--ease)}
.why{margin-top:14px;color:var(--ash);font-size:15px;line-height:1.45}
.why b{color:#fff;font-weight:600}
.src{margin-top:10px}
.lfoot{border-top:1px solid var(--hair);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.lfoot .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.verdict{font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{margin:0;font-size:14px;padding:14px;min-height:76px}
.end{text-align:center;padding-top:8vh}
.end h3{font-size:clamp(44px,10vw,88px);font-weight:500;letter-spacing:-.04em;line-height:.95;margin:0 0 18px}
.end .kv{justify-content:center;margin-bottom:30px}

@media (max-width:520px){
  .step{height:122px;gap:14px}
  .node{width:78px;height:78px}.node svg{width:88px;height:88px}.node .num{font-size:29px}
  .step.pad-l{padding-left:12%}.step.pad-r{padding-right:12%}
  .info h2{font-size:17px}
}
@keyframes olaq{0%,62%,100%{opacity:.66;text-shadow:none}74%{opacity:1;text-shadow:0 0 12px currentColor}}
@media (prefers-reduced-motion:reduce){*:not(.hl):not(.ol):not(.ghost):not(.pill):not(.lcl){animation:none!important;transition:none!important}.ghost,.pill,.lcl{transition:none!important}.ol{animation-name:olaq}}.nt{font-size:14px;line-height:1.4;border-radius:12px;padding:10px 14px;margin-top:12px}
.nt.d{border:1px solid #ff9a1f;color:#ff9a1f}.nt.dd{border:1px dashed #b388ff;color:#b388ff}
.cl .qlist{margin-top:18px}
.cl .esc{margin:18px auto}
.pdf{position:fixed;z-index:40;right:16px;top:16px;bottom:16px;width:min(46vw,640px);background:var(--night-2);border:1px solid var(--hair);border-radius:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;animation:in .5s var(--ease)}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.ptop .mono{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .x{font-family:var(--mono);width:34px;height:34px}
.pstage{position:relative;flex:1;min-height:0;display:flex;padding:16px 52px 14px}
/* como en el boceto: una nota al frente y las otras dos asomando borrosas a los lados */
.pbk{position:absolute;top:46px;bottom:40px;width:46%;border:0;padding:0;background:none;cursor:pointer;font-family:var(--mono);font-size:11px;line-height:1;color:#fff;transition:transform .35s var(--ease)}
.pbk::before{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(#f3f3ee 0 10px,#c4c4bd 10px 12px);filter:blur(3px);opacity:.7}
.pbk span{position:absolute;top:14px;writing-mode:vertical-rl;white-space:nowrap;background:rgba(8,8,8,.82);padding:9px 5px;border-radius:7px}
.pbk.izq{left:8px;transform:rotate(-3deg);z-index:1}.pbk.izq span{left:9px}
.pbk.der{right:8px;transform:rotate(3deg);z-index:0}.pbk.der span{right:9px}
.pbk.d3{right:3px;transform:rotate(6deg)}.pbk.d3 span{top:auto;bottom:14px;right:4px}
.pbk.izq:hover{transform:translateX(-4px) rotate(-4deg)}.pbk.der:hover{transform:translateX(4px) rotate(4deg)}
.pbk:hover::before{opacity:.95}
.pbk b{font-weight:700}
.pscroll{position:relative;z-index:2;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 40px;
  background:var(--night-2);border:1px solid var(--hair);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.65)}
.pscroll.gira{animation:gira .45s var(--ease)}
@keyframes gira{from{opacity:0;transform:translateY(-26px) scale(.94)}to{opacity:1;transform:none}}
.pfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hair)}
.pfoot .x{font-family:var(--mono);width:40px;height:40px;flex:none}
.pnom{flex:1;min-width:0;text-align:center}
.pnom b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnom span{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnom span.top{color:#ff9a1f}
.pg{position:relative;margin:0 auto 12px;background:#fff;border-radius:6px;overflow:hidden}
.pg canvas{display:block;width:100%;height:100%}
.pg .n{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:11px;color:#8a8a8a}
.pg .hl{position:absolute;background:rgba(255,138,0,.62);mix-blend-mode:multiply;border-radius:2px;pointer-events:none;animation:late 2.6s ease-in-out infinite}
@keyframes late{0%,100%{opacity:1}50%{opacity:.28}}
@media (min-width:900px){
  body.conpdf .ltop,body.conpdf .lbody,body.conpdf .lfoot{padding-right:calc(min(46vw,640px) + 36px)}
}
@media (max-width:899px){
  .pdf{left:8px;right:8px;width:auto;top:30%;bottom:8px}
  .pstage{padding:12px 40px 10px}.pbk{width:44%}.pnom span{white-space:normal;font-size:10px}.pfoot{padding:7px 10px}
.nt.pdfb{display:inline-block}
</style>
<style>html.emb header .logo,html.emb header .stats a,html.emb .top .logo,html.emb .top .crumbs:not(.cnt){display:none!important}</style><script>try{if(parent!==window)document.documentElement.classList.add("emb")}catch(e){}</script>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="../" style="color:inherit;text-decoration:none">neumo<span class="script">mapa</span></a>
  <div class="stats mono"><a href="../final/" style="color:#c084fc;border:1px solid #7c3aed;border-radius:99px;padding:4px 12px;margin-right:6px">Último final →</a><a href="../final2/" style="color:#fb7185;text-decoration:none;border:1px solid #be123c;border-radius:99px;padding:4px 12px">Final 2 →</a><span>racha <b id="sRacha">0</b> d</span><span><b id="sXp">0</b> xp</span></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="tag">✦ Examen de Neumología · lunes 7 dic 2026</div>
    <h1>Un concepto, <span class="script">una</span> pregunta</h1>
    <p>Cada lección explica primero el concepto y luego te pone la pregunta de examen que lo evalúa. Lo que fallas vuelve hasta que lo dominas.</p>
    <div class="bar"><i id="gBar" style="width:0"></i></div>
    <div class="mono" style="margin-top:10px"><span id="gTxt"></span></div>
  </section>
  <section class="map" id="map"></section>
</main>
<div class="foot"><div class="wrap">
  <button class="ghost" id="bTodas" style="background-color:#e5262b;border-color:#ff5a5f;color:#fff">🔥 Todas las preguntas</button>
  <button class="pill" id="bSeguir"><span>Continuar</span><span class="arr">→</span></button>
</div></div>
<div class="sheet" id="sheet" hidden></div>
<div class="lesson" id="lesson" hidden></div>
<div class="pdf" id="pdf" hidden>
  <div class="ptop"><button class="x" id="pX" aria-label="Cerrar el PDF">✕</button><span class="mono" id="pTxt"></span>
    <button class="x" id="pMen" aria-label="Alejar">−</button><button class="x" id="pMas" aria-label="Acercar">+</button></div>
  <div class="pstage">
    <button class="pbk izq" id="pB1"></button><button class="pbk der" id="pB2"></button><button class="pbk der d3" id="pB3"></button>
    <div class="pscroll" id="pScr"></div>
  </div>
  <div class="pfoot"><button class="x" id="pAnt" aria-label="Notas anteriores">←</button>
    <div class="pnom"><b id="pNom"></b><span class="mono" id="pRank"></span></div>
    <button class="x" id="pSig" aria-label="Notas siguientes">→</button></div>
</div>
<script src="data.js?v=1"></script>
<script src="clase.js?v=1"></script>
<script src="ruleta-data.js?v=1"></script>
<script>
(function(){
'use strict';
var D=window.NEUMO, CL=window.NEUMO_CLASE||{}, KEY='neumo-mapa-v1', DOM=2;
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var neg=function(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')};
var f2=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
var baraja=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a};
var S={it:{},td:{},lec:{},xp:0,dias:[]};
try{var g=JSON.parse(localStorage.getItem(KEY)||'null');if(g)for(var k in g)S[k]=g[k]}catch(e){}
function guarda(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var POR={};D.temas.forEach(function(t){t.items.forEach(function(i){POR[i.id]=i})});
function dom(i){var r=S.it[i.id];return !!r&&r.c>=DOM}
function avance(t){var n=0;t.items.forEach(function(i){var r=S.it[i.id];if(r)n+=Math.min(r.c,DOM)});return n/(DOM*t.items.length)}
function contestadas(t){var n=0;t.items.forEach(function(i){if(S.td[i.id]||S.it[i.id])n++});return n}
function racha(){var set={},n=0,d=new Date();S.dias.forEach(function(x){set[x]=1});if(!set[f2(d)])d.setDate(d.getDate()-1);while(set[f2(d)]){n++;d.setDate(d.getDate()-1)}return n}

function pinta(){
  var h='',tot=0,hechas=0,sigue=-1;
