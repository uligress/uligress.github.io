<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Geria mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --night:#05080c; --night-2:#0b0f14; --white:#fff; --ash:#aaa9ad; --graphite:#5b5b5b;
  --glass:rgba(255,255,255,.03); --hair:rgba(255,255,255,.1);
  --ok:#7fd6a4; --bad:#ff8f8f;
  --sans:"Geist",system-ui,sans-serif; --script:"Great Vibes",cursive; --mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--white);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);font-size:13px;color:var(--ash);letter-spacing:0}
.script{font-family:var(--script);font-weight:400;letter-spacing:0}
[hidden]{display:none!important}

/* encabezado */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--night) 70%,transparent);padding:18px 0 22px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;letter-spacing:-.04em}
.logo .script{font-size:28px;margin-left:2px}
.stats{display:flex;gap:16px}
.stats b{color:var(--white);font-weight:500}

/* portada */
.hero{padding:26px 0 8px}
.hero .tag{font-size:13px;color:var(--ash)}
.hero h1{margin:14px 0 14px;font-weight:500;font-size:clamp(48px,11vw,104px);line-height:.95;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 30%,#aaa9ad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .script{font-size:1.3em;line-height:.7;padding-right:.12em}
.hero p{margin:0;max-width:520px;color:var(--ash);font-size:16px;line-height:1.45}
.bar{height:2px;background:var(--hair);margin-top:22px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--white);transition:width .8s var(--ease)}

/* mapa */
.map{position:relative;padding:34px 0 120px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.step{position:relative;display:flex;align-items:center;gap:18px;height:132px}
.step.r{flex-direction:row-reverse;text-align:right}
.node{position:relative;flex:none;width:92px;height:92px;border-radius:50%;background:var(--night-2);border:1px solid var(--hair);
  display:grid;place-items:center;transition:transform .5s var(--ease),background .3s}
.node:hover{transform:scale(1.05)}
.node .num{font-family:var(--script);font-size:34px;color:var(--ash);line-height:1}
.node svg{position:absolute;inset:-5px;width:102px;height:102px;transform:rotate(-90deg)}
.node circle{fill:none;stroke-width:3}
.node .trk{stroke:transparent}
.node .prg{stroke:var(--white);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.step.now .node{background:var(--white)}
.step.now .node .num{color:var(--night)}
.step.done .node .num{color:#3ddc84}
.step.done .node{border-color:#3ddc84;background:rgba(61,220,132,.10)}
.step.done .node .prg{stroke:#3ddc84}
.node .chk{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:#3ddc84;color:var(--night);display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1}
.step.done .info .mono{color:#3ddc84}
.step.lock .node{opacity:.35}
.step.lock .info{opacity:.35}
.info{min-width:0;flex:1}
.info h2{margin:0 0 6px;font-size:19px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.step.pad-l{padding-left:22%}
.finh{position:relative;text-align:center;padding:46px 0 26px}.finh .mono{color:#ff9a1f}.finh p{margin:8px 0 0;color:var(--ash);font-size:14px}
.step.pad-r{padding-right:22%}

/* botones */
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--white);color:var(--night);border-radius:999px;padding:6px 6px 6px 22px;font-size:15px}
.pill .arr{width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--white);display:grid;place-items:center;transition:transform .4s var(--ease)}
.pill:hover .arr{transform:rotate(-45deg) scale(1.08)}
.pill:disabled{opacity:.3;cursor:default}
.ghost{border:1px solid var(--hair);border-radius:999px;padding:12px 20px;font-size:15px}
.ghost:hover{background:var(--glass)}
/* brillo sutil que cruza los botones */
.lfoot .in.fin{flex-wrap:wrap;justify-content:center;gap:10px}
.cal{margin:6px 0 16px}.cal .nota{font-size:72px;font-weight:600;line-height:1;letter-spacing:-.03em}.cal .nota small{font-size:22px;opacity:.55;font-weight:400}
.cal>.mono{margin-top:8px}.cal details{margin-top:14px;text-align:left}.cal summary{cursor:pointer;text-align:center}
.cal ol{max-height:34vh;overflow:auto;margin:10px 0 0;padding-left:22px;font-size:14px;line-height:1.4}.cal li{margin-bottom:10px;opacity:.85}.cal li b{display:block;color:#fff;margin-top:2px}
@keyframes brillo{0%,55%{background-position:130% 0}100%{background-position:-60% 0}}
.ghost,.lcl,.pill{background-repeat:no-repeat;background-size:220% 100%;background-position:130% 0;animation:brillo 4.2s ease-in-out infinite}
.ghost,.lcl{background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%)}
.pill{background-image:linear-gradient(110deg,transparent 42%,rgba(5,8,12,.13) 50%,transparent 58%)}
.pill:disabled{animation:none}
/* efecto ola: las letras de los botones se alumbran una por una, sutil, para que se noten */
@keyframes ola{0%,62%,100%{opacity:.66;transform:none;text-shadow:none}74%{opacity:1;transform:translateY(-1.5px);text-shadow:0 0 12px currentColor}}
.ol{display:inline-block;white-space:pre;opacity:.66;animation:ola 3.4s ease-in-out infinite}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--night) 65%,transparent);z-index:4}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* hoja de tema */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:end center}
.sheet .card{width:min(720px,100%);background:var(--night-2);border:1px solid var(--hair);border-radius:20px 20px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:up .5s var(--ease)}
.sheet h3{margin:6px 0 10px;font-size:clamp(28px,6vw,40px);font-weight:500;letter-spacing:-.04em;line-height:1}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* clase del tema (caso, ideas y perlas en diapositivas) */
.cl{text-align:center;padding-top:clamp(8px,4vh,40px)}
.cl .esc{position:relative;width:132px;height:132px;margin:26px auto 26px}
.cl .av{width:132px;height:132px;border-radius:50%;background:var(--night-2);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1}
.cl .chip{position:absolute;left:74%;top:-20px;white-space:nowrap;background:#fff;color:#000;border-radius:16px 16px 16px 4px;padding:7px 13px;font-size:14px;font-weight:600;letter-spacing:-.01em;animation:in .6s .15s var(--ease) both}
.cl h4{margin:10px 0 14px;font-size:clamp(25px,5.4vw,36px);font-weight:500;letter-spacing:-.04em;line-height:1.05}
.cl p{margin:0 auto;max-width:560px;font-size:clamp(17px,2.5vw,20px);line-height:1.5;color:var(--ash);text-align:left}
.cl p b{color:#fff;font-weight:600}
.cl.perla .av{border-color:#ff9a1f;box-shadow:0 0 0 6px rgba(255,154,31,.08)}
.cl.perla .mono,.cl.perla p b{color:#ff9a1f}
.cl.perla .chip{background:#ff9a1f}
.cl.caso .av{border-color:#3ddc84}
.cl.caso .mono{color:#3ddc84}
@media(max-width:480px){.cl .chip{left:62%}}

.cl.clave .av{border-style:dashed;border-color:#b388ff;box-shadow:0 0 0 6px rgba(179,136,255,.08)}
.cl.clave .mono,.cl.clave h4,.cl.clave p{color:#b388ff}
.cl.clave p b{color:#c9a6ff}
.cl.clave .chip{background:#b388ff}
.cl .rul{margin-top:22px}
/* clase flotante: se ve encima de las preguntas y se puede mover */
.flot{position:fixed;z-index:45;right:16px;bottom:96px;width:min(360px,calc(100vw - 24px));background:rgba(11,15,20,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.7);overflow:hidden}
.flot .fh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-bottom:1px solid var(--hair)}
.flot .fh .mono{flex:1;font-size:12px}
.flot .x{width:32px;height:32px;font-size:14px}
.flot .fb{padding:14px 16px 16px;max-height:44vh;overflow:auto}
.flot .fe{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:30px;line-height:1}
.flot .fe span{background:#fff;color:#000;border-radius:12px 12px 12px 4px;padding:4px 10px;font-size:13px;font-weight:600}
.flot h5{margin:0 0 8px;font-size:19px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.flot p{margin:0;font-size:15px;line-height:1.45;color:var(--ash)}
.flot p b{color:#fff;font-weight:600}
.flot.perla p b,.flot.perla .fh .mono{color:#ff9a1f}
.flot.perla .fe span{background:#ff9a1f}
.flot.caso .fh .mono{color:#3ddc84}
.flot.clave{border-color:rgba(179,136,255,.55)}
.flot.clave .fh .mono,.flot.clave h5,.flot.clave p{color:#b388ff}
.flot.clave p b{color:#c9a6ff}
.flot.clave .fe span{background:#b388ff}
.flot .ff{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--hair)}
.lcl{border:1px solid var(--hair);border-radius:999px;padding:8px 14px;font-size:13px;flex:none}
.lcl:hover{background:var(--glass)}

/* lección */
.lesson{position:fixed;inset:0;z-index:30;background:var(--night);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:16px 20px}
.ltop .bar{flex:1;margin:0;height:4px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);font-size:16px;flex:none}
.lbody{flex:1;overflow:auto;padding:10px 20px 20px}
.lbody .in{max-width:640px;margin:0 auto;animation:in .6s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.kind{font-size:13px;color:var(--ash)}
.q{font-size:clamp(21px,4.4vw,28px);letter-spacing:-.02em;line-height:1.2;margin:14px 0 22px}
.caso u{text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-decoration-thickness:1.5px;text-underline-offset:3px;color:var(--white)}
.orig{font-size:13px;color:var(--ash);line-height:1.45;margin:12px 0 0}.orig .mono{display:block;margin-bottom:4px}
.caso{font-size:15px;color:var(--ash);line-height:1.45;border-left:1px solid var(--hair);padding:2px 0 2px 16px;margin:14px 0 4px}
.caso .mono{margin-bottom:6px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin-bottom:10px;font-size:16px;line-height:1.35;transition:background .2s,border-color .2s,opacity .2s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.07)}
.opt .l{font-family:var(--mono);font-size:13px;color:var(--ash);padding-top:2px}
.opt.sel{border-color:var(--white)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.4}
.ans{background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:18px;font-size:18px;line-height:1.35;animation:in .5s var(--ease)}
.why{margin-top:14px;color:var(--ash);font-size:15px;line-height:1.45}
.why b{color:#fff;font-weight:600}
.src{margin-top:10px}
.lfoot{border-top:1px solid var(--hair);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.lfoot .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.verdict{font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{margin:0;font-size:14px;padding:14px;min-height:76px}
.end{text-align:center;padding-top:8vh}
.end h3{font-size:clamp(44px,10vw,88px);font-weight:500;letter-spacing:-.04em;line-height:.95;margin:0 0 18px}
.end .kv{justify-content:center;margin-bottom:30px}

/* visor del PDF: panel flotante a la derecha de la pregunta */
.pdfb{margin-top:16px;font-size:14px;padding:10px 16px}
.pdf{position:fixed;z-index:40;right:16px;top:16px;bottom:16px;width:min(46vw,640px);background:var(--night-2);border:1px solid var(--hair);border-radius:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;animation:in .5s var(--ease)}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.ptop .mono{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .x{font-family:var(--mono);width:34px;height:34px}
.pstage{position:relative;flex:1;min-height:0;display:flex;padding:16px 52px 14px}
/* como en el boceto: una nota al frente y las otras dos asomando borrosas a los lados */
.pbk{position:absolute;top:46px;bottom:40px;width:46%;border:0;padding:0;background:none;cursor:pointer;font-family:var(--mono);font-size:11px;line-height:1;color:#fff;transition:transform .35s var(--ease)}
.pbk::before{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(#f3f3ee 0 10px,#c4c4bd 10px 12px);filter:blur(3px);opacity:.7}
.pbk span{position:absolute;top:14px;writing-mode:vertical-rl;white-space:nowrap;background:rgba(8,8,8,.82);padding:9px 5px;border-radius:7px}
.pbk.izq{left:8px;transform:rotate(-3deg);z-index:1}.pbk.izq span{left:9px}
.pbk.der{right:8px;transform:rotate(3deg);z-index:0}.pbk.der span{right:9px}
.pbk.d3{right:3px;transform:rotate(6deg)}.pbk.d3 span{top:auto;bottom:14px;right:4px}
.pbk.izq:hover{transform:translateX(-4px) rotate(-4deg)}.pbk.der:hover{transform:translateX(4px) rotate(4deg)}
.pbk:hover::before{opacity:.95}
.pbk b{font-weight:700}
.pscroll{position:relative;z-index:2;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 40px;
  background:var(--night-2);border:1px solid var(--hair);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.65)}
.pscroll.gira{animation:gira .45s var(--ease)}
@keyframes gira{from{opacity:0;transform:translateY(-26px) scale(.94)}to{opacity:1;transform:none}}
.pfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hair)}
.pfoot .x{font-family:var(--mono);width:40px;height:40px;flex:none}
.pnom{flex:1;min-width:0;text-align:center}
.pnom b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnom span{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnom span.top{color:#ff9a1f}
.pg{position:relative;margin:0 auto 12px;background:#fff;border-radius:6px;overflow:hidden}
.pg canvas{display:block;width:100%;height:100%}
.pg .n{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:11px;color:#8a8a8a}
.pg .hl{position:absolute;background:rgba(255,138,0,.62);mix-blend-mode:multiply;border-radius:2px;pointer-events:none;animation:late 2.6s ease-in-out infinite}
@keyframes late{0%,100%{opacity:1}50%{opacity:.28}}
@media (min-width:900px){
  body.conpdf .ltop,body.conpdf .lbody,body.conpdf .lfoot{padding-right:calc(min(46vw,640px) + 36px)}
}
@media (max-width:899px){
  .pdf{left:8px;right:8px;width:auto;top:30%;bottom:8px}
  .pstage{padding:12px 40px 10px}.pbk{width:44%}.pnom span{white-space:normal;font-size:10px}.pfoot{padding:7px 10px}
}

/* clase con ruleta: mitad diapositiva, mitad notas; las notas entran por la derecha y empujan la diapositiva */
@keyframes lado{from{transform:translateX(100%)}to{transform:none}}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
body.encl .ltop,body.encl .lbody,body.encl .lfoot{transition:padding-right .45s var(--ease)}
@media (min-width:900px){
  body.conpdf.encl .pdf{right:0;top:0;bottom:0;width:50vw;border-radius:0;border-width:0 0 0 1px;animation:lado .45s var(--ease)}
  body.conpdf.encl .ltop,body.conpdf.encl .lbody,body.conpdf.encl .lfoot{padding-right:50vw}
  body.conpdf.encl .cl{max-width:440px;margin:0 auto}
}
@media (max-width:899px){
  body.conpdf.encl .pdf{left:0;right:0;top:50%;bottom:0;border-radius:18px 18px 0 0;animation:sube .45s var(--ease)}
  body.conpdf.encl .lesson{bottom:50%}
  body.conpdf.encl .cl .av{width:84px;height:84px;font-size:40px}
}

@media (max-width:520px){
  .step{height:122px;gap:14px}
  .node{width:78px;height:78px}.node svg{width:88px;height:88px}.node .num{font-size:29px}
  .step.pad-l{padding-left:12%}.step.pad-r{padding-right:12%}
  .info h2{font-size:17px}
}
@keyframes olaq{0%,62%,100%{opacity:.66;text-shadow:none}74%{opacity:1;text-shadow:0 0 12px currentColor}}
@media (prefers-reduced-motion:reduce){*:not(.hl):not(.ol):not(.ghost):not(.pill):not(.lcl){animation:none!important;transition:none!important}.ghost,.pill,.lcl{transition:none!important}.ol{animation-name:olaq}}
</style>
<style>html.emb header .logo,html.emb header .stats a,html.emb .top .logo,html.emb .top .crumbs:not(.cnt){display:none!important}</style><script>try{if(parent!==window)document.documentElement.classList.add("emb")}catch(e){}</script>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="../" style="color:inherit;text-decoration:none">geria<span class="script">mapa</span></a>
  <div class="stats mono"><a href="../final/" style="color:#c084fc;text-decoration:none;border:1px solid #7c3aed;border-radius:99px;padding:4px 12px">Último final →</a><a href="../final2/" style="color:#fb7185;text-decoration:none;border:1px solid #be123c;border-radius:99px;padding:4px 12px;margin-left:6px">Final 2 →</a><span>racha <b id="sRacha">0</b> d</span><span><b id="sXp">0</b> xp</span></div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="tag">✦ Exámenes anteriores · Geriatría</div>
    <h1>Un escalón, <span class="script">un</span> tema</h1>
    <p>Las preguntas de tus exámenes anteriores convertidas en lecciones cortas. Lo que fallas vuelve hasta que lo dominas.</p>
    <div class="bar"><i id="gBar" style="width:0"></i></div>
    <div class="mono" style="margin-top:10px"><span id="gTxt"></span></div>
  </section>
  <section class="map" id="map"></section>
</main>

<div class="foot"><div class="wrap">
  <button class="ghost" id="bLibre"></button>
  <button class="pill" id="bSeguir"><span>Continuar</span><span class="arr">→</span></button>
</div></div>

<div class="sheet" id="sheet" hidden></div>
<div class="lesson" id="lesson" hidden></div>
<div class="flot" id="flot" hidden></div>
<div class="pdf" id="pdf" hidden>
  <div class="ptop"><button class="x" id="pX" aria-label="Cerrar el PDF">✕</button><span class="mono" id="pTxt"></span>
    <button class="x" id="pMen" aria-label="Alejar">−</button><button class="x" id="pMas" aria-label="Acercar">+</button></div>
  <div class="pstage">
    <button class="pbk izq" id="pB1"></button><button class="pbk der" id="pB2"></button><button class="pbk der d3" id="pB3"></button>
    <div class="pscroll" id="pScr"></div>
  </div>
  <div class="pfoot"><button class="x" id="pAnt" aria-label="Notas anteriores">←</button>
    <div class="pnom"><b id="pNom"></b><span class="mono" id="pRank"></span></div>
    <button class="x" id="pSig" aria-label="Notas siguientes">→</button></div>
</div>

<script src="data.js?v=11"></script>
<script src="clase.js?v=2"></script>
<script src="clase-notas.js?v=1"></script>
<script>
(function(){
'use strict';
var D = window.GERIA, KEY = 'geria-mapa-v1', TAM = 10, DOMINIO = 2;
var $ = function(id){return document.getElementById(id)};
var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var hoy = function(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
var baraja = function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a};

/* ---------- estado (solo en este navegador) ---------- */
var S = {it:{}, lec:{}, xp:0, dias:[], libre:true};
try{var g=JSON.parse(localStorage.getItem(KEY)||'null'); if(g) for(var k in g) S[k]=g[k]}catch(e){}
function guarda(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function reg(id){return S.it[id]||(S.it[id]={c:0,w:0})}
function dominada(it){var r=S.it[it.id];return !!r&&r.c>=DOMINIO}
function avance(t){var n=0;t.items.forEach(function(i){var r=S.it[i.id];if(r)n+=Math.min(r.c,DOMINIO)});return n/(DOMINIO*t.items.length)} // cada acierto a la primera suma; 2 = dominada
// td: preguntas ya contestadas en el modo «Todas las preguntas» (es lo que marca la escalera)
// la primera vez se siembra con lo ya contestado antes, para no perder el avance guardado
if(!S.td){ S.td={}; for(var k0 in S.it) S.td[k0]=1; }
function contestadas(t){var n=0;t.items.forEach(function(i){if(S.td[i.id])n++});return n}
function abierta(i){return S.libre||i===0||(S.lec[D.temas[i-1].n]||0)>0}
function racha(){
  var set={},n=0,d=new Date();S.dias.forEach(function(x){set[x]=1});
  var f=function(x){return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)};
  if(!set[f(d)]) d.setDate(d.getDate()-1);
  while(set[f(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- mapa ---------- */
function pinta(){
  var actual=-1, hechas=0, total=0;
  D.temas.forEach(function(t,i){
    t.items.forEach(function(it){total++; if(dominada(it))hechas++});
    if(actual<0 && abierta(i) && avance(t)<1) actual=i;
  });
  // el escalón "actual" es el más avanzado abierto que no está dominado
  D.temas.forEach(function(t,i){ if(abierta(i)&&avance(t)<1&&!S.libre) actual=i; });
  if(S.libre){actual=-1;D.temas.some(function(t,i){if(avance(t)<1){actual=i;return true}})}
  var h='', sigue=-1;
  D.temas.some(function(t,i){if(abierta(i)&&contestadas(t)<t.items.length){sigue=i;return true}});
  D.temas.forEach(function(t,i){
    var nc=contestadas(t), nt=t.items.length, p=nc/nt, ab=abierta(i), C=2*Math.PI*48;
    var lado=i%2?'r pad-r':'pad-l';
    var est=!ab?'lock':(nc>=nt?'done':(i===sigue?'now':''));
    if(t.fin===1) h+='<div class="finh"><div class="mono">✦ Exámenes finales</div><p>Preguntas variadas de todos los temas</p></div>';
    h+='<div class="step '+lado+' '+est+'" data-i="'+i+'">'+
      '<button class="node" data-i="'+i+'" aria-label="'+(t.fin?'':'Tema '+t.n+': ')+esc(t.titulo)+(ab?' · '+nc+' de '+nt+' contestadas':' (bloqueado)')+'">'+
        '<svg viewBox="0 0 102 102"><circle class="trk" cx="51" cy="51" r="48"/><circle class="prg" cx="51" cy="51" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p)).toFixed(1)+'"/></svg>'+
        '<span class="num">'+(t.fin?'E'+t.fin:('0'+t.n).slice(-2))+'</span>'+(ab&&nc>=nt?'<span class="chk" aria-hidden="true">✓</span>':'')+'</button>'+
      '<div class="info"><h2>'+esc(t.titulo)+'</h2><div class="mono">'+
        (ab?(nc>=nt?'✓ completo · '+nc+' / '+nt+' contestadas':nc+' / '+nt+' contestadas'+(nc?' · faltan '+(nt-nc):'')):'bloqueado · completa el anterior')+'</div></div></div>';
  });
  $('map').innerHTML='<svg class="path" id="pth"></svg>'+h;
  $('gBar').style.width=(100*hechas/total).toFixed(1)+'%';
  $('gTxt').textContent=hechas+' / '+total+' preguntas dominadas';
  $('sRacha').textContent=racha(); $('sXp').textContent=S.xp;
  $('bLibre').textContent=S.libre?'Volver al orden':'Abrir todos los temas';
  $('bSeguir').dataset.i=actual<0?0:actual;
  traza();
}
function traza(){
  var m=$('map'), s=$('pth'), b=m.getBoundingClientRect(), d='', prev=null;
  m.querySelectorAll('.node').forEach(function(n){
    var r=n.getBoundingClientRect(), x=r.left-b.left+r.width/2, y=r.top-b.top+r.height/2;
    if(prev){var my=(prev.y+y)/2; d+=' C'+prev.x+' '+my+','+x+' '+my+','+x+' '+y} else d='M'+x+' '+y;
    prev={x:x,y:y};
  });
  s.setAttribute('viewBox','0 0 '+b.width+' '+b.height);
  s.innerHTML='<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>';
}
window.addEventListener('resize',traza);

/* ---------- hoja del tema ---------- */
function hoja(i){
  var t=D.temas[i], ab=abierta(i), dom=0, rep=0, mc=0;
  t.items.forEach(function(it){if(dominada(it))dom++; if(it.x>=2)rep++; if(it.o)mc++});
  $('sheet').innerHTML='<div class="card" role="dialog" aria-modal="true">'+
    '<div class="mono">✦ '+(t.fin?'Examen final · variado':'Tema <span>'+('0'+t.n).slice(-2)+'</span>')+'</div><h3>'+esc(t.titulo)+'</h3>'+
    '<div class="kv mono"><span><b style="color:#fff">'+dom+'</b> / '+t.items.length+' dominadas</span><span><b style="color:#fff">'+contestadas(t)+'</b> / '+t.items.length+' contestadas en Todas</span>'+(t.fin?'<span>'+esc(t.sub)+'</span>':'<span>'+rep+' repetidas en exámenes</span>')+'<span>'+(S.lec[t.n]||0)+' lecciones hechas</span></div>'+
    '<div class="row">'+(ab?
      '<button class="pill" id="hIr"><span>'+(dom>=t.items.length?'Repasar':'Empezar lección')+'</span><span class="arr">→</span></button>':
      '<span class="mono">Completa una lección del tema anterior para abrirlo.</span>')+
    '<button class="'+(ab?'ghost':'pill')+'" id="hTodas" style="margin:0;background-color:#e5262b;border-color:#ff5a5f;color:#fff">🔥 Todas las preguntas · '+t.items.length+'</button>'+
    (t.fin?'':'<button class="ghost pdfb" style="margin:0" data-tn="'+t.n+'">Notas del tema · 3 apuntes y diapositivas</button>')+
    (CL[t.n]?'<button class="ghost" id="hCl" style="margin:0">Clase del tema · caso y perlas</button>':'')+
    '<button class="ghost" id="hX">Cerrar</button></div></div>';
  $('sheet').hidden=false;
  $('hX').onclick=function(){$('sheet').hidden=true};
  if(ab) $('hIr').onclick=function(){$('sheet').hidden=true;empieza(i)};
  $('hTodas').onclick=function(){$('sheet').hidden=true;empieza(i,true)};
  if($('hCl')) $('hCl').onclick=function(){$('sheet').hidden=true;clase(i)};
}
$('sheet').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
$('map').addEventListener('click',function(e){var n=e.target.closest('.node');if(n)hoja(+n.dataset.i)});
$('bSeguir').onclick=function(){empieza(+this.dataset.i)};
$('bLibre').onclick=function(){S.libre=!S.libre;guarda();pinta()};

/* ---------- clase del tema: un caso que avanza, ideas y perlas ---------- */
var CN=window.GERIA_CLASE_NOTAS||{}, CL=window.GERIA_CLASE||{}, C=null, ETQ={caso:'Caso clínico',idea:'Nueva idea',perla:'Perla de examen',clave:'Lo más preguntable · apunte del grupo'};
function clase(i,luego){
  var t=D.temas[i]; C={i:i,t:t,d:CL[t.n],k:0,luego:luego};
  pCierra(); document.body.classList.add('encl'); $('lesson').hidden=false; document.body.style.overflow='hidden'; cPinta();
}
/* clase flotante */
var F={n:0,k:0,pos:{}};
function fAbre(tn){ if(F.n!==tn){ if(F.n)F.pos[F.n]=F.k; F.n=tn; F.k=F.pos[tn]||0 } $('flot').hidden=false; fPinta(); fCabe() }
function fCabe(){ var f=$('flot'); if(f.hidden||!f.style.left) return; var r=f.getBoundingClientRect(); f.style.left=Math.max(4,Math.min(window.innerWidth-r.width-4,r.left))+'px'; f.style.top=Math.max(4,Math.min(window.innerHeight-60,r.top))+'px' }
window.addEventListener('resize',fCabe);
function fCierra(){ $('flot').hidden=true }
function fPinta(){
  var ds=CL[F.n], d=ds[F.k], f=$('flot');
  f.className='flot '+d.l;
  f.innerHTML='<div class="fh" id="fH"><span class="mono">✦ '+ETQ[d.l].split(' · ')[0]+' · Tema '+('0'+F.n).slice(-2)+' · '+(F.k+1)+' / '+ds.length+'</span><button class="x" id="fX" aria-label="Cerrar la clase flotante">✕</button></div>'+
    '<div class="fb"><div class="fe">'+d.e+'<span>'+esc(d.c)+'</span></div><h5>'+esc(d.t)+'</h5><p>'+esc(d.x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p></div>'+
    '<div class="ff"><button class="x" id="fA" aria-label="Diapositiva anterior"'+(F.k?'':' disabled style="opacity:.3"')+'>←</button><button class="ghost pdfb" style="margin:0;font-size:12px;padding:6px 12px" data-dia="f">Ruleta de apuntes</button><button class="x" id="fS" aria-label="Diapositiva siguiente"'+(F.k<ds.length-1?'':' disabled style="opacity:.3"')+'>→</button></div>';
  if(!$('pdf').hidden&&P.dia==='f') pDia(F.n,F.k,'f');
  $('fX').onclick=fCierra; $('fA').onclick=function(){F.k--;fPinta()}; $('fS').onclick=function(){F.k++;fPinta()};
  var h=$('fH'), a=null;
  h.onpointerdown=function(e){ if(e.target.closest('button'))return; var r=f.getBoundingClientRect(); a={x:e.clientX-r.left,y:e.clientY-r.top}; h.setPointerCapture(e.pointerId) };
  h.onpointermove=function(e){ if(!a)return; var r=f.getBoundingClientRect();
    f.style.left=Math.max(4,Math.min(window.innerWidth-r.width-4,e.clientX-a.x))+'px'; f.style.top=Math.max(4,Math.min(window.innerHeight-60,e.clientY-a.y))+'px'; f.style.right='auto'; f.style.bottom='auto' };
  h.onpointerup=h.onpointercancel=function(){a=null};
}
function cFin(sigue){
  var c=C; C=null; pCierra(); document.body.classList.remove('encl'); if(!S.cl)S.cl={}; S.cl[c.t.n]=1; guarda();
  if(sigue==='sig'){ clase(cSigTema(c.i)); return }
  // a las preguntas: la lección que esperaba o, si la clase se abrió sola, todas las de examen del tema
  if(sigue){ if(c.luego) c.luego(); else empieza(c.i,true,true); return }
  $('lesson').hidden=true; document.body.style.overflow=''; pinta();
}
function cSigTema(i){ for(var j=i+1;j<D.temas.length;j++) if(CL[D.temas[j].n]) return j; return -1 }
function cPinta(){
  var d=C.d[C.k], n=C.d.length, ult=C.k===n-1;
  $('lesson').innerHTML='<div class="ltop"><button class="x" id="lX" aria-label="Salir de la clase">✕</button><div class="bar"><i style="width:'+(100*(C.k+1)/n)+'%"></i></div><span class="mono">'+(C.k+1)+' / '+n+'</span></div>'+
    '<div class="lbody"><div class="in cl '+d.l+'"><div class="esc"><div class="av">'+d.e+'</div><div class="chip">'+esc(d.c)+'</div></div>'+
    '<div class="mono">✦ '+ETQ[d.l]+' · Tema '+('0'+C.t.n).slice(-2)+'</div><h4>'+esc(d.t)+'</h4><p>'+esc(d.x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>'+(ult?'':'<button class="ghost pdfb rul" data-dia="c">Ruleta de apuntes · ver en las notas</button>')+'</div></div>'+
    (ult?'<div class="lfoot"><div class="in fin"><button class="ghost" id="cEsc">Escalones</button>'+
      '<button class="pill" id="cSig"><span>Preguntas de examen</span><span class="arr">→</span></button>'+
      (cSigTema(C.i)>=0?'<button class="ghost" id="cOtra">Siguiente clase</button>':'')+'</div></div>'
    :'<div class="lfoot"><div class="in">'+(C.k?'<button class="ghost" id="cAnt">Atrás</button>':'<button class="ghost" id="cSal">Saltar clase</button>')+
    '<button class="pill" id="cSig"><span>Continuar</span><span class="arr">→</span></button></div></div>');
  $('lX').onclick=function(){cFin(false)};
  if($('cAnt')) $('cAnt').onclick=function(){C.k--;cPinta()};
  if($('cSal')) $('cSal').onclick=function(){cFin(true)};
  if($('cEsc')) $('cEsc').onclick=function(){cFin(false)};
  if($('cOtra')) $('cOtra').onclick=function(){cFin('sig')};
  if(ult) pCierra();
  if(!$('pdf').hidden) pDia(C.t.n,C.k,'c');
  $('cSig').onclick=function(){ if(ult) cFin(true); else{C.k++;cPinta()} };
}

/* ---------- lección ---------- */
var L=null;
function elige(t){
  // prioridad: falladas recientes, luego no dominadas más repetidas en exámenes; los casos van juntos
  var pend=t.items.filter(function(i){return !dominada(i)});
  var base=pend.length?pend:t.items;
  var orden=baraja(base).sort(function(a,b){
    var ra=S.it[a.id]||{c:0,w:0}, rb=S.it[b.id]||{c:0,w:0};
    return (rb.w-rb.c)-(ra.w-ra.c) || b.x-a.x;
  });
  var sel=[], ya={};
  for(var i=0;i<orden.length&&sel.length<TAM;i++){
    var it=orden[i]; if(ya[it.id])continue;
    var grupo=it.c?t.items.filter(function(z){return z.c===it.c}):[it];
    grupo.forEach(function(z){if(!ya[z.id]&&sel.length<TAM+3){ya[z.id]=1;sel.push(z)}});
  }
  return sel;
}
function empieza(i,todas,sinClase){
  // la primera vez, antes de las preguntas va la clase del tema
  if(!sinClase&&CL[D.temas[i].n]&&!(S.cl&&S.cl[D.temas[i].n])){ clase(i,function(){empieza(i,todas,true)}); return }
  // todas: el tema completo en su orden (los casos quedan juntos); lo fallado vuelve al final hasta acertarlo
  var t=D.temas[i], items=todas?t.items.slice():elige(t), cola=[];
  // un ejercicio de emparejar con 4 tarjetas de recuerdo cortas y distintas
  var cortas=items.filter(function(x){return !x.o&&!x.c&&x.a.length<=60&&x.q.length<=140}), usados={}, par=[];
  if(!todas) cortas.forEach(function(x){var k=x.a.toLowerCase();if(par.length<4&&!usados[k]){usados[k]=1;par.push(x)}});
  var enPar={}; if(par.length===4) par.forEach(function(x){enPar[x.id]=1});
  items.forEach(function(x){ if(!enPar[x.id]) cola.push({tipo:(x.o&&x.k!=null)?'mc':'rec',it:x}) });
  if(par.length===4) cola.splice(Math.min(3,cola.length),0,{tipo:'par',its:par});
  L={i:i,t:t,todas:!!todas,cola:cola,total:cola.length,hechas:0,ok:0,mal:0,primera:{}};
  $('lesson').hidden=false; document.body.style.overflow='hidden';
  sig();
}
function cierra(){ pCierra(); fCierra(); $('lesson').hidden=true; document.body.style.overflow=''; L=null; pinta(); }
function marca(it,bien){
  var r=reg(it.id), prim=!(it.id in L.primera);
  if(prim){L.primera[it.id]=bien; if(bien)L.ok++; else L.mal++}
  if(bien){ if(prim) r.c++; } else { r.w++; r.c=0; }
  if(L.todas) S.td[it.id]=1;
  guarda(); // se guarda en cada respuesta, aunque salgas a media lección
}
function marco(cuerpo,pie){
  pCierra(); // el PDF trae la respuesta subrayada: se cierra al pasar a otra pregunta
  var p=L.total?100*L.hechas/L.total:0;
  $('lesson').innerHTML='<div class="ltop"><button class="x" id="lX" aria-label="Salir de la lección">✕</button><div class="bar"><i style="width:'+p+'%"></i></div><span class="mono">'+L.hechas+' / '+L.total+'</span>'+(CL[L.t.n]?'<button class="lcl" id="lCl">Clase flotante</button>':'')+'</div>'+
    '<div class="lbody"><div class="in">'+cuerpo+'</div></div><div class="lfoot"><div class="in">'+pie+'</div></div>';
  $('lX').onclick=cierra;
  if($('lCl')) $('lCl').onclick=function(){ if($('flot').hidden) fAbre(L.t.n); else fCierra() };
}
function meta(it){
  return (it.x>=2?'<span>'+({5:'Muy repetida',3:'Recurrente',2:'2 veces'})[it.x]+'</span> · ':'')+esc(it.f||'');
}
function nota(it){
  // preguntas de seguimiento: se muestra la viñeta literal del caso (viene de su primera pregunta)
  var v=it.c&&D.casos&&D.casos[it.c]&&D.casos[it.c].v;
  return v?'<div class="caso"><div class="mono">✦ Caso clínico</div>'+subr(v,it.h)+'</div>':'';
}
function subr(v,h){
  // subraya en la viñeta los fragmentos importantes para esta pregunta (literales; todas sus apariciones)
  var r=[],o='',p=0;
  (h||[]).forEach(function(x){for(var i=v.indexOf(x);x&&i>=0;i=v.indexOf(x,i+x.length))r.push([i,i+x.length])});
  r.sort(function(a,b){return a[0]-b[0]});
  r.forEach(function(x){if(x[1]<=p)return;var a=Math.max(x[0],p);o+=esc(v.slice(p,a))+'<u>'+esc(v.slice(a,x[1]))+'</u>';p=x[1]});
  return o+esc(v.slice(p));
}
function explica(it){
  var neg=function(x){return esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')};
  var av=(it.d?'⚠ Dudosa · ':'')+(it.s?'Sin clave · ':'')+(it.r?'opciones reconstruidas · ':'');
  return (it.qd?'<div class="orig"><span class="mono">Así venía en el examen</span>«'+esc(it.q)+'»</div>':'')+(it.e?'<div class="why">'+neg(it.e)+'</div>':(it.w?'<div class="why">'+esc(it.w)+'</div>':'')+(it.nt?'<div class="why">'+esc(it.nt)+'</div>':''))+
    (it.e&&(av||it.fu)?'<div class="mono src">'+esc(av+(it.fu||''))+'</div>':'')+
    '<div class="mono src">'+meta(it)+'</div>'+
    (SIN(it)?'':'<button class="ghost pdfb" data-id="'+it.id+'">'+pEtq(it)+'</button>');
}
function SIN(it){return it.id.charAt(0)==='f'&&!pHay(it)} // pregunta de examen final que ningún apunte responde: sin ruleta
function sig(){
  if(!L.cola.length) return fin();
  var c=L.cola[0];
  if(c.tipo==='mc') mc(c); else if(c.tipo==='rec') rec(c); else par(c);
}
function avanza(c,bien){
  L.cola.shift();
  if(bien) L.hechas++; else L.cola.push(c); // lo fallado vuelve al final
  sig();
}
function mc(c){
  var it=c.it, ops=baraja(it.o.map(function(o,i){return {o:o,i:i}})), sel=-1, visto=false;
  var LETRAS=/\b[a-e] y [a-e]\b/i, FIJA=/anteriores|^todas las opciones/i;
  if(it.o.some(function(o){return LETRAS.test(o)})) ops.sort(function(a,b){return a.i-b.i}); // opciones que citan letras: orden original
  else ops=ops.filter(function(o){return !FIJA.test(o.o)}).concat(ops.filter(function(o){return FIJA.test(o.o)}));
  marco('<div class="kind">✦ Elige la respuesta</div>'+nota(it)+'<div class="q">'+esc(it.qd||it.q)+'</div>'+
    ops.map(function(o,j){return '<button class="opt" data-j="'+j+'"><span class="l">'+'abcde'[j]+'</span><span>'+esc(o.o)+'</span></button>'}).join('')+'<div id="fb"></div>',
    '<span class="verdict" id="vd"></span><button class="pill" id="go" disabled><span>Comprobar</span><span class="arr">→</span></button>');
  pPrev(it);
  var bs=[].slice.call(document.querySelectorAll('#lesson .opt'));
