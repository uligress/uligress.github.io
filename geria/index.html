<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#05080c">
<title>Geriatría · estudio</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estudio/estudio.css?v=1">
<style>html.emb header .logo,html.emb header .stats a,html.emb .top .logo,html.emb .top .crumbs:not(.cnt){display:none!important}</style><script>try{if(parent!==window)document.documentElement.classList.add("emb")}catch(e){}</script>
</head><body>

<style>html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}
.shell-top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--hair);background:var(--night)}
.shell-top .modes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.mode{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--hair);color:var(--ash);font-size:14px;font-weight:500;text-decoration:none;letter-spacing:-.01em}
.mode[aria-current=page]{background:#fff;color:#05080c;border-color:#fff}
.mode.f1{color:#c084fc;border-color:#7c3aed}.mode.f2{color:#fb7185;border-color:#be123c}
.mode.f1[aria-current=page],.mode.f2[aria-current=page]{background:transparent}
.mode.f1[aria-current=page]{box-shadow:inset 0 0 0 1px #c084fc}.mode.f2[aria-current=page]{box-shadow:inset 0 0 0 1px #fb7185}
#fr{flex:1 1 auto;width:100%;border:0;background:var(--night)}
@media(max-width:640px){.shell-top{padding:10px 12px;gap:8px}.shell-top .logo{display:none}}</style>
<header class="shell-top"><a class="logo" href="../" title="uligress.me">Geria<span class="script">estudio</span></a>
<nav class="modes" id="modes">
<a class="mode" data-k="mapa" href="#mapa">Mapa</a><a class="mode" data-k="clase" href="#clase">Clase</a><a class="mode" data-k="rep" href="#rep">Más repetidas</a>
<a class="mode f1" data-k="final" href="#final">Último final</a><a class="mode f2" data-k="final2" href="#final2">Final 2</a></nav>
<a class="mode" href="../neumo/">Neumo →</a></header>
<iframe id="fr" title="Geriatría" allow="fullscreen"></iframe>
<script>
(function(){var R={mapa:'mapa/',clase:'clase/',rep:'clase/#rep',final:'final/',final2:'final2/'},fr=document.getElementById('fr'),cur='';
function go(){var h=location.hash.slice(1)||'clase',p=h.split('/'),k=p[0];if(!R[k]){k='clase';p=['clase']}
var src=R[k];if(k==='clase'&&p.length>1)src='clase/#'+p.slice(1).join('/');
document.querySelectorAll('.mode[data-k]').forEach(function(a){a.dataset.k===k?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
if(cur!==k||k==='clase'){fr.src=src;cur=k}}
window.addEventListener('hashchange',go);go();})();
</script></body></html>
